[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "u1sim"
version = "0.1.0"
description = "Snapmaker U1 Klippy API simulator, plus a Home Assistant integration for the U1 over Moonraker"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "zkasuran" }]
keywords = ["snapmaker", "u1", "klipper", "moonraker", "home-assistant", "3d-printing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Hardware",
]
# The simulator speaks the Klippy socket protocol with asyncio, json and socket
# from the standard library, so it has no runtime dependencies. The Home
# Assistant integration lives in custom_components/ and is not installed from
# here: Home Assistant loads it from the config directory and supplies aiohttp.
dependencies = []

[project.urls]
Homepage = "https://github.com/zkasuran/u1-companion"
Issues = "https://github.com/zkasuran/u1-companion/issues"

[project.scripts]
u1sim = "u1sim.__main__:main"

[tool.setuptools.packages.find]
include = ["u1sim*"]

[tool.setuptools.package-data]
u1sim = ["scenarios/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["_recon"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # import order
  "UP",  # pyupgrade
  "B",   # bugbear
  "SIM", # simplify
  "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
